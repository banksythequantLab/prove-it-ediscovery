services:
  sandbox-image:            # builds the sandbox image only; exits immediately
    build: ./sandbox
    image: prove-it-sandbox:latest
    entrypoint: ["true"]
  app:
    build: .
    restart: unless-stopped
    environment:
      - VULTR_INFERENCE_API_KEY=${VULTR_INFERENCE_API_KEY}
      - VULTR_MODEL=${VULTR_MODEL:-llama-3.3-70b-instruct-fp8}
      - TMPDIR=/var/lib/prove-it/sbx      # same path on host + container so sandbox bind mounts resolve
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/prove-it/sbx:/var/lib/prove-it/sbx
    expose: ["8000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [DOMAIN=${DOMAIN:-:80}]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
volumes: { caddy_data: {} }
